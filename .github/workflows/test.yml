name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Pages are up to date (run `npm run pages` and commit if this fails)
        run: npm run pages && git diff --exit-code -- '*.html' sitemap.xml robots.txt
